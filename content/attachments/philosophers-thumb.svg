<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Deep Dark Background -->
  <rect width="800" height="600" fill="#11111b" rx="20"/>

  <defs>
    <!-- Squid Game Pink / Teal Gradients -->
    <linearGradient id="guardPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f38ba8" />
      <stop offset="100%" stop-color="#eba0ac" />
    </linearGradient>
    <linearGradient id="playerTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94e2d5" />
      <stop offset="100%" stop-color="#89dceb" />
    </linearGradient>
    <linearGradient id="tableGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#313244" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e1e2e" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="tealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- The Ominous Circular Table -->
  <circle cx="400" cy="300" r="140" fill="url(#tableGlow)" stroke="#45475a" stroke-width="4"/>
  <circle cx="400" cy="300" r="100" fill="none" stroke="#313244" stroke-width="2" stroke-dasharray="10 15"/>

  <!-- Forks / Mutexes (represented as glowing pink batons/lines) -->
  <g stroke="url(#guardPink)" stroke-width="6" stroke-linecap="round" filter="url(#pinkGlow)">
    <line x1="400" y1="180" x2="400" y2="230" /> <!-- Top -->
    <line x1="514" y1="263" x2="466" y2="280" /> <!-- Top Right -->
    <line x1="470" y1="395" x2="440" y2="354" /> <!-- Bottom Right -->
    <line x1="330" y1="395" x2="360" y2="354" /> <!-- Bottom Left -->
    <line x1="286" y1="263" x2="334" y2="280" /> <!-- Top Left -->
  </g>

  <!-- Philosophers (represented as Player Teal nodes) -->
  <g fill="url(#playerTeal)" filter="url(#tealGlow)">
    <!-- Top Right -->
    <circle cx="530" cy="200" r="25" />
    <path d="M 520 205 L 540 205 L 530 190 Z" fill="#11111b" /> <!-- Triangle -->

    <!-- Right -->
    <circle cx="570" cy="340" r="25" />
    <rect x="560" y="330" width="20" height="20" fill="#11111b" /> <!-- Square -->

    <!-- Bottom -->
    <circle cx="400" cy="460" r="25" />
    <circle cx="400" cy="460" r="10" fill="none" stroke="#11111b" stroke-width="4" /> <!-- Circle -->

    <!-- Left -->
    <circle cx="230" cy="340" r="25" />
    <rect x="220" y="330" width="20" height="20" fill="#11111b" /> <!-- Square -->
  </g>

  <!-- The Doomed Philosopher (Top Left) -->
  <circle cx="270" cy="200" r="25" fill="#f38ba8" filter="url(#pinkGlow)"/>
  <circle cx="270" cy="200" r="10" fill="none" stroke="#11111b" stroke-width="4" /> <!-- Circle -->

  <!-- Sniper Laser / Elimination Threat (time_to_die) -->
  <line x1="0" y1="0" x2="270" y2="200" stroke="#f38ba8" stroke-width="3" filter="url(#pinkGlow)" stroke-dasharray="15 5"/>
  <circle cx="270" cy="200" r="35" fill="none" stroke="#f38ba8" stroke-width="2" filter="url(#pinkGlow)"/>
  
  <!-- Crosshair elements -->
  <line x1="270" y1="150" x2="270" y2="165" stroke="#f38ba8" stroke-width="3" />
  <line x1="270" y1="235" x2="270" y2="250" stroke="#f38ba8" stroke-width="3" />
  <line x1="220" y1="200" x2="235" y2="200" stroke="#f38ba8" stroke-width="3" />
  <line x1="305" y1="200" x2="320" y2="200" stroke="#f38ba8" stroke-width="3" />

  <!-- Code/Terminal Text Overlay -->
  <g font-family="monospace" font-size="16" fill="#a6adc8" font-weight="bold">
    <text x="60" y="50">system: ELIMINATION_IMMINENT</text>
    <text x="60" y="75" fill="#f38ba8">thread_1: time_to_die_exceeded</text>
  </g>
</svg>